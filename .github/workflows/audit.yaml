name: Audit

# Once a week an agent reads the repository for what a script cannot see: two
# functions doing one job with different code, and engine work that moved into
# a hotter loop. It never gates — same commit, same verdict is something a
# model cannot promise, and "nothing blocks a push" stays true. What it finds
# becomes at most three issues labelled `audit`.
#
# An agent in CI turns dangerous when four things meet: TOOLS that act, a
# SECRET worth having, INPUT an attacker controls, and a PUBLIC LOG to carry
# the result out. Every choice below removes one of the four, and says which.

on:
  # INPUT: never a push, never a pull request. No PR title, branch name or
  # fork's diff ever reaches the prompt — what the agent reads is `main`, which
  # only people with push rights wrote. Weekly is also ~$4 a month; an agent on
  # every push would be ~$100.
  schedule:
    - cron: '0 4 * * 1'
  # Kept: a job that cannot be run by hand cannot be debugged. A dispatched run
  # executes the workflow file of the ref it is given and `main` is not
  # protected — which is why the key lives in an environment restricted to
  # `main` rather than in the repository: a run from anywhere else gets none.
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  # ── the deterministic half: what the agent will be handed ──
  # SECRET: none here, and no token left behind by the checkout either.
  candidates:
    name: candidates
    if: github.repository == 'anpawo/Video-Code'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # "changed since last week" is a diff against history

      # Clones outside the declared twins, and an index of every function with
      # this week's marked. Without the index the agent would re-read, every
      # Monday, the same clones `--list` prints for free.
      - run: python3 test/repetition_check.py --candidates candidates.json

      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: candidates.json
          retention-days: 7

  audit:
    name: agent, then script
    needs: candidates
    runs-on: ubuntu-latest
    # SECRET: the key exists only in this environment, and the environment
    # only deploys from `main`. It is a key of its own, in a workspace of its
    # own, with a monthly spend cap set at the provider — the one limit that
    # holds whatever this file says.
    environment: audit
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: candidates

      # Green before the key exists: a workflow that is red from the day it
      # lands is one nobody looks at the day it means something. Only the
      # comparison crosses into the step, never the key.
      - name: Is there a key?
        id: key
        env:
          PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          [ "$PRESENT" = true ] || echo "::notice::No ANTHROPIC_API_KEY in the audit environment — nothing was audited. docs/WORKFLOWS.md says how to create it."

      # An exact version: this is the one program that runs next to the key,
      # and a floating tag is a pointer its owner can move.
      - name: Install the agent
        if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.276

      # The ONE step that holds the key, and the only thing in it is the agent.
      #
      # TOOLS: Read, Grep, Glob — `--tools` removes every other tool rather
      # than merely not approving it. No shell, no network, no write, no GitHub
      # token anywhere in this step: an agent talked into misbehaving by a
      # comment in the repository can read files and answer, nothing more.
      # `--restricted` keeps those reads inside the checkout — /proc/self/environ
      # is a file too, and the key is in it.
      # INPUT: `--bare` loads no CLAUDE.md, no hooks, no project settings. The
      # repository's CLAUDE.md orders any agent to update and publish a status
      # board; here it is a file to audit, not a set of orders.
      # PUBLIC LOG: the answer goes to a file. Nothing the model wrote is
      # echoed — the log gets four numbers, and the CLI's own complaint when it
      # fails, because a red run that cannot say why gets disabled, not fixed.
      # Two caps on top of the provider's: turns, and dollars.
      - name: The agent reads
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          status=0
          claude -p --bare --restricted \
            --model claude-sonnet-5 \
            --tools "Read,Grep,Glob" --allowedTools "Read,Grep,Glob" \
            --max-turns 40 --max-budget-usd 2 \
            --no-session-persistence \
            --output-format json \
            < .github/prompts/audit.md > run.json 2> run.err || status=$?
          jq '{subtype, is_error, num_turns, total_cost_usd}' run.json || true
          [ "$status" -eq 0 ] || head -c 600 run.err
          exit "$status"

      # No model from here on. The script decides what is worth an issue: line
      # ranges that exist, no declared twin, no base class, no claim about
      # speed, three at most. The token that can write issues appears only
      # now, in a step where nothing the agent wrote is ever executed — it is
      # passed as data, quoted, or through a file.
      - name: The script decides
        if: steps.key.outputs.present == 'true'
        run: python3 test/audit_validate.py run.json -o findings.json

      # One issue per finding, keyed on an ID made from the code it cites.
      # Open OR closed counts as seen: closing an `audit` issue is how a
      # finding is refused, and a refused finding stays silent. The label is
      # the bridge to the board — CI cannot publish it, the next local session
      # reads the open `audit` issues and can.
      - name: One issue per finding nobody has seen
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -c '.findings[]' findings.json | while read -r finding; do
            id=$(jq -r .id <<< "$finding")
            seen=$(gh issue list --label audit --state all --search "$id in:title,body" --json number --jq length)
            if [ "$seen" -gt 0 ]; then
              echo "$id: raised before — open or closed, the answer stands"
              continue
            fi
            jq -r '
              "**\(.kind)** — `\(.a.file):\(.a.start)-\(.a.end)`"
              + (if .b then " ↔ `\(.b.file):\(.b.start)-\(.b.end)`" else "" end)
              + "\n\n\(.why)"
              + (if .delete != "" then "\n\n**Delete:** \(.delete)" else "" end)
              + "\n\n---\nWritten by the weekly audit agent and checked by `test/audit_validate.py`: the lines exist, the rest is its opinion. Closing this issue refuses it for good — say why in the closing comment, that is the reason the board will show.\n\n`audit-id: \(.id)`"
            ' <<< "$finding" > body.md
            gh issue create --label audit --title "audit: $(jq -r .title <<< "$finding") [$id]" --body-file body.md
          done

      - name: What it cost
        if: ${{ !cancelled() && steps.key.outputs.present == 'true' }}
        run: |
          {
            echo "### Audit"
            jq -r '"\(.num_turns // "?") turns, $\(.total_cost_usd // "?")"' run.json || echo "the agent left no result"
            if [ -f findings.json ]; then jq -r '"\(.findings | length) finding(s) passed the script"' findings.json; fi
          } >> "$GITHUB_STEP_SUMMARY"
